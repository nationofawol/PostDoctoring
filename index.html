<!DOCTYPE html>
<html>
<head>
<title>PostDoctoring Directory</title>

<style>
body{
  font-family: Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  margin-bottom:15px;
}

.name{
  font-size:20px;
  font-weight:bold;
}
</style>

</head>

<body>

<h1>PostDoctoring Directory</h1>

<div id="directory">Loading data...</div>

<script>

async function loadSheet(){

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

const response = await fetch(sheetURL);
const csv = await response.text();

const rows = csv.split("\n").slice(1);

const container = document.getElementById("directory");
container.innerHTML = "";

rows.forEach(row => {

const cols = row.split(",");

const name = cols[0];
const category = cols[1];
const description = cols[2];

const card = `
<div class="card">
<div class="name">${name}</div>
<div><b>Category:</b> ${category}</div>
<p>${description}</p>
</div>
`;

container.innerHTML += card;

});

}

loadSheet();

</script>

</body>
</html>
