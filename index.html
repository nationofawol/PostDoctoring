<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
async function loadSheet(){

  const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

  const response = await fetch(sheetURL);
  const csv = await response.text();

  // parse CSV using Papa Parse with headers
  const results = Papa.parse(csv, {
    header: true,    // use the first row as headers
    skipEmptyLines: true
  });

  const data = results.data; // array of objects

  const container = document.getElementById("directory");
  container.innerHTML = "";

  // loop through each row object
  data.forEach(row => {

    let cardContent = "";

    // for each header in the row, add header + value
    for(const header in row){

      if(row[header]){  // skip empty cells
        cardContent += `
        <div>
          <b>${header}</b><br>
          ${row[header]}
        </div><br>
        `;
      }
    }

    const card = `
      <div class="card">
        ${cardContent}
      </div>
    `;

    container.innerHTML += card;

  });

}

loadSheet();
</script>
