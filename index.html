<!DOCTYPE html>
<html>
<head>
<title>PostDoctoring Directory</title>

<style>
body{
  font-family: Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  margin-bottom:15px;
}

.name{
  font-size:20px;
  font-weight:bold;
}
</style>

</head>

<body>
#### title of the page #
<h1>PostDoctoring Directory</h1>

# naming this page as a directory #
<div id="directory">Loading data...</div>

<script>

async function loadSheet(){

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

const response = await fetch(sheetURL);
const csv = await response.text();

### do not want header ####
const rows = csv.split("\n");

const container = document.getElementById("directory");
container.innerHTML = "";


  ## reading the spreadsheet ##
rows.forEach(row => {

const cols = row.split(",");

const PI = cols[4];
const School = cols[5];
const Department = cols[6];

const card = `
<div class="card">
<div class="name">${PI}</div>
<div><b>Category:</b> ${School}</div>
<p>${Department}</p>
</div>
`;

container.innerHTML += card;

});

}

loadSheet();

</script>

</body>
</html>
