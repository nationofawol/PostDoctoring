<!DOCTYPE html>
<html>
<head>
  <title>PostDoctoring Directory</title>
  <style>
    body{ font-family: "Monaco","Courier New", monospace; max-width:700px; margin:auto; background:#000; color:#fff; padding:20px;}
    .nav{ margin-bottom:20px; font-weight:bold; }
    .card{ border:1px solid #fff; border-radius:8px; padding:15px; margin-bottom:15px; cursor:pointer;}
    .emailed{ background-color:#A9A9A9; }
    .accepted{ background-color:#6495ED; }
    .rejected{ background-color:#EE4B2B; }
    .card-title{ font-size:20px; font-weight:bold; margin-bottom:10px;}
    .field{ margin-bottom:5px; }
    .legend{ position:fixed; right:20px; top:80px; border:1px solid #ddd; border-radius:8px; padding:15px; width:150px; background:#000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="nav">
  <a href="index.html">Directory</a> | <a href="map.html">Map</a>
</div>

<h1>PostDoctoring Directory</h1>

<div class="legend">
  <b>Status</b>
  <div><span style="color:#A9A9A9;">Emailed</span></div>
  <div><span style="color:#6495ED;">Accepted</span></div>
  <div><span style="color:#EE4B2B;">Rejected</span></div>
</div>

<div id="directory">Loading data...</div>

<script>
async function loadSheet() {
  const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";
  const response = await fetch(sheetURL);
  const csv = await response.text();
  const results = Papa.parse(csv,{header:true, skipEmptyLines:true});
  const data = results.data;

  const container = document.getElementById("directory");
  container.innerHTML = "";

  data.forEach(row => {
    let cardClass = "card";
    if(row["Did I Email Them?"]==="Yes") cardClass += " emailed";
    if(row["Accepted or Rejected?"]==="Accepted") cardClass += " accepted";
    if(row["Accepted or Rejected?"]==="Rejected") cardClass += " rejected";

    let cardContent = "";
    for(const header in row){
      if(["PI","Did I Email Them?","Accepted or Rejected?","ROI","Latitude","Longitude","Address"].includes(header)) continue;
      if(row[header]) cardContent += `<div class="field"><b>${header}:</b> ${row[header]}</div>`;
    }

    const piName = row["PI"];
    const card = document.createElement("div");
    card.className = cardClass;
    card.innerHTML = `<div class="card-title">${piName}</div>${cardContent}`;

    // On click, go to map.html with PI in URL
    card.addEventListener("click", () => {
      window.location.href = `map.html?pi=${encodeURIComponent(piName)}`;
    });

    container.appendChild(card);
  });
}

loadSheet();
</script>
</body>
</html>
