<!DOCTYPE html>
<html>
<head>
  <title>PostDoctoring Directory</title>

  <style>
    body{
      font-family: Arial;
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      border:1px solid #ddd;
      border-radius:8px;
      padding:15px;
      margin-bottom:15px;
    }

    .name{
      font-size:20px;
      font-weight:bold;
    }
  </style>

  <!-- Include Papa Parse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<h1>PostDoctoring Directory</h1>

<div id="directory">Loading data...</div>

<script>
async function loadSheet(){

  try {

    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

    const response = await fetch(sheetURL);
    const csv = await response.text();

    // parse CSV using Papa Parse
    const results = Papa.parse(csv, {
      header: true,        // use first row as headers
      skipEmptyLines: true // skip empty rows
    });

    const data = results.data;

    const container = document.getElementById("directory");
    container.innerHTML = "";

    // loop through each row
    data.forEach(row => {
      let cardContent = "";

      for(const header in row){
        if(row[header]){
          cardContent += `
            <div>
              <b>${header}</b><br>
              ${row[header]}
            </div><br>
          `;
        }
      }

      const card = `<div class="card">${cardContent}</div>`;
      container.innerHTML += card;
    });

  } catch(error){
    console.error("Error loading spreadsheet:", error);
    document.getElementById("directory").innerHTML = "Failed to load data.";
  }
}

// run the function
loadSheet();
</script>

</body>
</html>
