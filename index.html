<!DOCTYPE html>
<html>
<head>
<title>PostDoctoring Directory</title>

<style>
body{
  font-family: Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.entry{
  border:1px solid #ccc;
  border-radius:8px;
  padding:15px;
  margin-bottom:15px;
}

.name{
  font-size:20px;
  font-weight:bold;
}
</style>

</head>

<body>

<h1>PostDoctoring Directory</h1>

<div id="directory">Loading directory...</div>

<script>

async function loadDirectory(){

  const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

  const response = await fetch(sheetURL);
  const csv = await response.text();

  const rows = csv.split("\n").slice(1);

  const container = document.getElementById("directory");
  container.innerHTML = "";

  rows.forEach(row => {

    const columns = row.split(",");

    const name = columns[0];
    const category = columns[1];
    const description = columns[2];
    const website = columns[3];

    const entry = `
      <div class="entry">
        <div class="name">${name}</div>
        <div><b>Category:</b> ${category}</div>
        <p>${description}</p>
        <a href="${website}" target="_blank">Visit Website</a>
      </div>
    `;

    container.innerHTML += entry;

  });

}

loadDirectory();

</script>

</body>
</html>
