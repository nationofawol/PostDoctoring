<!DOCTYPE html>
<html>
<head>
  <title>PostDoctoring</title>

  <style>
    body{
      font-family: Arial;
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .card{
      border:1px solid #ddd;
      border-radius:8px;
      padding:15px;
      margin-bottom:15px;
    }

    .emailed{
  background-color:#e0e0e0;
}
    .accepted{
  background-color:#98FB98;
}

     .rejected{
  background-color:#FFCCCB;
}

    .card-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .field{
      margin-bottom:5px;
    }
  </style>

  <!-- Include Papa Parse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<h1>PostDoctoring</h1>

<div id="directory">Loading data...</div>

<script>
async function loadSheet(){

  try {

    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

    const response = await fetch(sheetURL);
    const csv = await response.text();

    // parse CSV using Papa Parse
    const results = Papa.parse(csv, {
      header: true,
      skipEmptyLines: true
    });

    const data = results.data;

    const container = document.getElementById("directory");
    container.innerHTML = "";

    data.forEach(row => {
      
      
let cardClass = "card";

const emailed = row["Did I Email Them?"];
const decision = row["Accepted or Rejected?"];

if(emailed === "Yes"){
  cardClass += " emailed";
}

if(decision === "Accepted"){
  cardClass += " accepted";
}

if(decision === "Rejected"){
  cardClass += " rejected";
}

      
      // Use "PI" as the title
      const title = row["PI"] || "No Name";

      let cardContent = "";

      // loop through all columns except "PI"
for(const header in row){

  // skip columns we don't want displayed
  if(header === "PI" || header === "Did I Email Them?" || header === "Accepted or Rejected?"){
    continue;
  }

  if(row[header]){
    cardContent += `
      <div class="field">
        <b>${header}:</b> ${row[header]}
      </div>
    `;
  }

}

      const card = `
  <div class="${cardClass}">
    <div class="card-title">${title}</div>
    ${cardContent}
  </div>
`;

      container.innerHTML += card;
    });

  } catch(error){
    console.error("Error loading spreadsheet:", error);
    document.getElementById("directory").innerHTML = "Failed to load data.";
  }

}

// run the function
loadSheet();
</script>

</body>
</html>
