<script>

async function loadSheet(){

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

const response = await fetch(sheetURL);
const csv = await response.text();

const rows = csv.split("\n");

// first row = column titles
const headers = rows[0].split(",");

// all other rows = data
const dataRows = rows.slice(1);

const container = document.getElementById("directory");
container.innerHTML = "";

// go through each spreadsheet row
dataRows.forEach(row => {

if(!row) return;

const cols = row.split(",");

let cardContent = "";

// pair each column with its header
headers.forEach((header, index) => {

const value = cols[index];

if(value){

cardContent += `
<div>
<b>${header}</b><br>
${value}
</div><br>
`;

}

});

const card = `
<div class="card">
${cardContent}
</div>
`;

container.innerHTML += card;

});

}

loadSheet();

</script>
