<!DOCTYPE html>
<html>
<head>
  <title>PostDoctoring Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body{
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      margin:0;
      padding:0;
    }

    .nav{
      padding:10px;
      font-weight:bold;
      background:#f2f2f2;
    }

    .nav a{
      margin-right:10px;
      text-decoration:none;
      color:#000;
    }

    #filters{
      padding:10px;
      background:#f9f9f9;
    }

    #map{
      height:90vh;
      width:100%;
    }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Papa Parse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

  <!-- Navigation -->
  <div class="nav">
    <a href="index.html">Directory</a> |
    <a href="map.html">Map</a>
  </div>

  <!-- Filters -->
  <div id="filters">
   <label for="roiFilter">ROI:</label>
<select id="roiFilter">
  <option value="all">All</option>
</select>

    <label for="statusFilter" style="margin-left:20px;">Status:</label>
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="Emailed">Emailed</option>
      <option value="Accepted">Accepted</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4ss2W452tpb0u3R931n4BH4tjexbMndvwjP_kCxaURkMqdYTlLMFBRbI8M4iXlSDV_IDjPgICw0Pb/pub?output=csv";

    // Initialize map
    const map = L.map("map").setView([39,-98],4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      attribution:"© OpenStreetMap"
    }).addTo(map);

    let markers = [];

    async function loadSheet() {
      const response = await fetch(sheetURL);
      const csv = await response.text();

      const results = Papa.parse(csv,{
        header:true,
        skipEmptyLines:true
      });

      const data = results.data;

      data.forEach(row => {
        const lat = parseFloat(row["Latitude"]);
        const lon = parseFloat(row["Longitude"]);
        if(!lat || !lon) return;

        const name = row["PI"] || "No Name";
        const school = row["School"] || "";
        const roi = row["ROI"] || "";
        const decision = row["Accepted or Rejected?"] || "";
        const emailed = row["Did I Email Them?"] || "";

        // Determine status
        let status = "Not Emailed";
        if(emailed === "Yes") status = "Emailed";
        if(decision === "Accepted") status = "Accepted";
        if(decision === "Rejected") status = "Rejected";

        // Marker color based on status
        let color = "gray";
        if(status === "Emailed") color = "gray";
        if(status === "Accepted") color = "#90D5FF";
        if(status === "Rejected") color = "#FFCCCB";

        const marker = L.circleMarker([lat, lon], {
          radius:8,
          fillColor: color,
          color:"#555",
          weight:1,
          opacity:1,
          fillOpacity:0.8
        });

        marker.bindPopup(`<b>${name}</b><br>${school}<br>ROI: ${roi}<br>Status: ${status}`);

        // Attach properties for filtering
        marker.roi = roi;
        marker.status = status;

        marker.addTo(map);
        markers.push(marker);
      });
    }

    // Update markers based on filters
    function updateMarkers(){
      const selectedROI = document.getElementById("roiFilter").value;
      const selectedStatus = document.getElementById("statusFilter").value;

      markers.forEach(marker => {
        const matchesROI = selectedROI === "all" || marker.roi === selectedROI;
        const matchesStatus = selectedStatus === "all" || marker.status === selectedStatus;

        if(matchesROI && matchesStatus){
          marker.addTo(map);
        } else {
          map.removeLayer(marker);
        }
      });
    }

    document.getElementById("roiFilter").addEventListener("change", updateMarkers);
    document.getElementById("statusFilter").addEventListener("change", updateMarkers);

    loadSheet();
  </script>

</body>
</html>
